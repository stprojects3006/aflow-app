<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'integration')}">
<body>
  <h2>TC-03: Cancel Queue Session</h2>
  <form th:action="@{/integration/queueit/cancel}" method="post" class="form-horizontal">
    <div class="form-group">
      <label for="sessionId">Session ID</label>
      <input type="text" class="form-control" id="sessionId" name="sessionId" required />
    </div>
    <div class="form-group">
      <button type="submit" class="btn btn-primary">Cancel Session</button>
    </div>
  </form>
  <div th:if="${response != null}">
    <h4>Response</h4>
    <pre th:text="${response}"></pre>
  </div>
</body>
</html>
