<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2 th:text="#{owner}">Owner</h2>
  <form th:object="${owner}" class="form-horizontal" id="add-owner-form" method="post">
    <div class="form-group has-feedback">
      <input th:replace="~{fragments/inputField :: input (#{firstName}, 'firstName', 'text')}" />
      <input th:replace="~{fragments/inputField :: input (#{lastName}, 'lastName', 'text')}" />
      <input th:replace="~{fragments/inputField :: input (#{address}, 'address', 'text')}" />
      <input th:replace="~{fragments/inputField :: input (#{city}, 'city', 'text')}" />
      <input th:replace="~{fragments/inputField :: input (#{telephone}, 'telephone', 'text')}" />
    </div>
    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button th:with="text=${owner['new']} ? #{addOwner} : #{updateOwner}" class="btn btn-primary" type="submit"
          th:text="${text}">Add Owner</button>
      </div>
    </div>
  </form>

  <div th:if="${showOverlay}">
    <!-- Overlay Modal -->
    <div class="modal fade show" id="queueOverlay" tabindex="-1" style="display:block; background:rgba(0,0,0,0.5);" aria-modal="true" role="dialog">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Queue-it Overlay</h5>
          </div>
          <div class="modal-body">
            <p>You have cleared the queue and can now add a new owner. This is a simulated overlay.</p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" onclick="document.getElementById('queueOverlay').style.display='none'">Close</button>
          </div>
        </div>
      </div>
    </div>
    <script>
      // Optionally, focus the modal or add more logic here
    </script>
  </div>
</body>

</html>
