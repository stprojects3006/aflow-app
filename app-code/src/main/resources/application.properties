# database init, supports mysql too
database=h2
spring.sql.init.schema-locations=classpath*:db/${database}/schema.sql
spring.sql.init.data-locations=classpath*:db/${database}/data.sql

# Web
spring.thymeleaf.mode=HTML

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Internationalization
spring.messages.basename=messages/messages

# Actuator - Enhanced Metrics Configuration
management.endpoints.web.exposure.include=*
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.export.prometheus.descriptions=true
management.metrics.export.prometheus.step=15s
management.metrics.tags.application=petclinic
management.metrics.tags.environment=development

# Enhanced HTTP Metrics
management.metrics.web.server.request.autotime.enabled=true
management.metrics.web.server.request.autotime.percentiles=0.5,0.95,0.99
management.metrics.web.server.request.autotime.percentiles-histogram=true

# Logging
logging.level.org.springframework=INFO
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE

# Maximum time static resources should be cached
spring.web.resources.cache.cachecontrol.max-age=12h

# Queue-it API integration
# queueit.api.base-url=https://api.queue-it.net
queueit.api.base-url=https://api.queue-it.net
queueit.api.customer-id=futuraforge
queueit.api.event-id=testvwr01
queueit.api.secret-key=62cc5b6d-cad7-44c5-88a2-34fa78f73b767c7dcee7-5e81-44c4-93ea-0990c14f3176
queueit.api.api-key=4607e3f0-dcb2-4714-9570-45d7e662c45f

# qFilter configuration (completely independent of QueueItSettings)
qfilter.customer-id=futuraforge
qfilter.event-id=testvwr01
qfilter.secret-key=62cc5b6d-cad7-44c5-88a2-34fa78f73b767c7dcee7-5e81-44c4-93ea-0990c14f3176
qfilter.api-key=4607e3f0-dcb2-4714-9570-45d7e662c45f

# Enable DEBUG logging for the QueueItIntegrationFilter
logging.level.org.springframework.samples.petclinic.integration.QueueItIntegrationFilter=DEBUG
