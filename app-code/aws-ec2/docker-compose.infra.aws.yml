version: '3.8'

# AWS EC2 version of infrastructure docker-compose
services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: petclinic
      MYSQL_USER: petclinic
      MYSQL_PASSWORD: petclinic
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../src/main/resources/db/mysql/data.sql:/docker-entrypoint-initdb.d/data.sql
      - ../../src/main/resources/db/mysql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - petclinic-net

  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_DB: petclinic
      POSTGRES_USER: petclinic
      POSTGRES_PASSWORD: petclinic
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../src/main/resources/db/postgres/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../../src/main/resources/db/postgres/02-data.sql:/docker-entrypoint-initdb.d/02-data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petclinic"]
      timeout: 20s
      retries: 10
    networks:
      - petclinic-net

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - petclinic-net

  grafana:
    image: grafana/grafana:12.0.2
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana.ini:/etc/grafana/grafana.ini
    networks:
      - petclinic-net
    depends_on:
      - prometheus

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-aws.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt # For SSL certs
      - /var/www/certbot:/var/www/certbot # For ACME challenge
    networks:
      - petclinic-net
    depends_on:
      - grafana
      - prometheus

volumes:
  mysql_data:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  petclinic-net:
    name: petclinic-net
    driver: bridge 