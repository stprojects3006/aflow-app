global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'petclinic'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['petclinic:8080']
    scrape_interval: 15s
    honor_labels: true
  - job_name: 'k6'
    static_configs:
      - targets: ['host.docker.internal:6565']
    scrape_interval: 15s
    honor_labels: true 